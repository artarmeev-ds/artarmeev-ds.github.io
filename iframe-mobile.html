<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Overview — Mobile</title>
<meta name="viewport" content="width=390">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--ds-color-bg-neutral);
    font-family: var(--ds-font-family);
    color: var(--ds-color-text-primary);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  body { width: 390px; min-height: 100vh; margin: 0 auto; }

  img.icon { display: block; }

  /* iOS-style status bar */
  .status-bar {
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 24px 4px;
  }
  .status-time { font-weight: 600; font-size: 17px; letter-spacing: -0.4px; }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .signal-bar { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
  .signal-bar i { width: 3px; background: var(--ds-color-text-primary); border-radius: 1px; display: inline-block; }
  .signal-bar i:nth-child(1) { height: 4px; }
  .signal-bar i:nth-child(2) { height: 7px; }
  .signal-bar i:nth-child(3) { height: 10px; }
  .signal-bar i:nth-child(4) { height: 12px; }
  .wifi-glyph {
    width: 16px; height: 12px;
    display: inline-block;
    background:
      radial-gradient(circle at 50% 100%, var(--ds-color-text-primary) 0 2px, transparent 2.5px),
      radial-gradient(circle at 50% 100%, transparent 0 4px, var(--ds-color-text-primary) 4.5px 6px, transparent 6.5px),
      radial-gradient(circle at 50% 100%, transparent 0 8px, var(--ds-color-text-primary) 8.5px 10px, transparent 10.5px),
      radial-gradient(circle at 50% 100%, transparent 0 12px, var(--ds-color-text-primary) 12.5px 14px, transparent 14.5px);
  }
  .battery {
    width: 28px; height: 14px;
    border: 1.5px solid var(--ds-color-text-primary);
    border-radius: 4px;
    position: relative;
    padding: 1.5px;
  }
  .battery::after {
    content: '';
    position: absolute;
    right: -3px; top: 4px;
    width: 2px; height: 4px;
    background: var(--ds-color-text-primary);
    border-radius: 0 1px 1px 0;
  }
  .battery i {
    display: block;
    background: var(--ds-color-text-primary);
    height: 100%;
    width: 90%;
    border-radius: 1.5px;
  }

  /* Top navigation bar */
  .top-nav {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    position: relative;
  }
  .nav-btn {
    width: 44px; height: 44px;
    display: inline-flex;
    align-items: center; justify-content: center;
    background: rgba(247, 247, 247, 0.7);
    backdrop-filter: blur(20px);
    border-radius: var(--ds-radius-pill);
    border: none;
    cursor: pointer;
    color: var(--ds-color-text-primary);
  }
  .nav-btn img { width: 24px; height: 24px; }
  .nav-title {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.3px;
  }

  /* Content area */
  .content {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Card base — no border per DS 2.1; rely on bg + radius alone */
  .card {
    background: var(--ds-color-bg-white);
    border-radius: var(--ds-radius-card-mobile);
    overflow: hidden;
  }

  /* Project hero card — uses 360 panorama image */
  .hero-img {
    height: 180px;
    background: url('resources/360%20images.png') center/cover no-repeat;
    position: relative;
  }
  .hero-badges {
    position: absolute;
    inset: 8px 8px auto 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .hero-loss {
    position: absolute;
    bottom: 8px; left: 8px;
    background: var(--ds-color-bg-white);
    border: 1px solid var(--ds-color-stroke-neutral);
    border-radius: var(--ds-radius-pill);
    padding: 3px 8px 3px 4px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 14px;
    font-weight: 400;
  }
  .hero-loss img { width: 16px; height: 16px; }

  .hero-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 16px 0;
  }
  .hero-title {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.3px;
    margin: 0;
  }
  .round-icon-btn {
    width: 32px; height: 32px;
    border-radius: var(--ds-radius-pill);
    background: var(--ds-color-bg-neutral-dark);
    border: none;
    display: inline-flex;
    align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .round-icon-btn img { width: 16px; height: 16px; }
  .hero-info {
    padding: 0 16px 16px;
    font-size: 14px;
    line-height: 18px;
    color: var(--ds-color-text-primary);
  }
  .hero-info p { margin: 0; }

  /* Stats card */
  .stats-card {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .stats-row {
    display: flex;
    align-items: center;
    text-align: center;
  }
  .stat {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .stat-num {
    font-size: var(--ds-font-size-h1);
    font-weight: 500;
    line-height: 28px;
    letter-spacing: -0.6px;
  }
  .stat-label {
    font-size: 16px;
    line-height: 20px;
    letter-spacing: -0.1px;
  }

  /* Pill button — DS 2.1 three-state palette: Base new / Light / Dark new */
  .pill-btn {
    height: 44px;
    border-radius: var(--ds-radius-pill);
    background: var(--ds-color-bg-action);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.3px;
    color: var(--ds-color-text-primary);
    cursor: pointer;
    padding: 12px 8px;
    font-family: inherit;
  }
  .pill-btn img { width: 24px; height: 24px; }
  .pill-btn:hover  { background: var(--ds-color-bg-action-hover); }
  .pill-btn:active { background: var(--ds-color-bg-action-pressed); }
  .pill-btn-outline {
    background: var(--ds-color-bg-white);
    border: 1px solid var(--ds-color-stroke-neutral);
  }

  /* ============== LEGACY MODE OVERRIDES (?v=old) ============== */
  /* Old mobile View rooms / Share access — light grey filled, no border */
  body.legacy .pill-btn-outline {
    background: #e2e0d3;
    border: none;
  }
  /* Yellow Open 360° gets dark text/icon (already handled by tokens for pill-btn) */
  body.legacy .pill-btn { color: #1a1905; }
  /* Active hero badge only shown in legacy */
  .legacy-only { display: none !important; }
  body.legacy .legacy-only { display: flex !important; }

  /* Section card (sketches, sow, estimates) */
  .section-card {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .section-card-head {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 24px;
    padding: 4px 0;
  }
  .section-card-title {
    margin: 0;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.3px;
    color: var(--ds-color-text-muted);
  }

  /* Tab bar */
  .tab-bar-wrap {
    padding: 0 25px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .tab-bar {
    height: 62px;
    width: 100%;
    background: rgba(247, 247, 247, 0.85);
    backdrop-filter: blur(20px);
    border-radius: 96px;
    padding: 4px;
    display: flex;
    gap: 0;
  }
  .tab {
    flex: 1;
    height: 54px;
    border-radius: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    color: var(--ds-color-text-muted);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.4px;
  }
  .tab.active {
    background: #ededed;
    color: var(--ds-color-text-primary);
  }
  .tab img { width: 24px; height: 24px; }
  .home-indicator {
    height: 5px;
    width: 134px;
    background: var(--ds-color-bg-black);
    border-radius: 100px;
    margin-top: 14px;
  }

  /* Mini badges (status, hero overlay) */
  .mini-badge {
    background: var(--ds-color-status-neutral-bg);
    color: var(--ds-color-status-neutral-text);
    border-radius: var(--ds-radius-pill);
    padding: 2px 8px;
    font-size: 12px;
    font-weight: 500;
  }
  .mini-badge.success { background: var(--ds-color-status-success-bg); color: var(--ds-color-status-success); }
  .mini-badge.warning { background: var(--ds-color-status-warning-bg); color: var(--ds-color-status-warning); }
</style>
</head>
<body class="proposal-1">

  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <span class="signal-bar"><i></i><i></i><i></i><i></i></span>
      <span class="battery"><i></i></span>
    </div>
  </div>

  <div class="top-nav">
    <button class="nav-btn" aria-label="Back"><img class="icon" src="icons/icon-chevron-left.svg" alt=""></button>
    <span class="nav-title">201025 Washington</span>
    <button class="nav-btn" aria-label="More"><img class="icon" src="icons/icon-more.svg" alt=""></button>
  </div>

  <div class="content">

    <!-- Project hero card -->
    <div class="card">
      <div class="hero-img">
        <div class="hero-loss">
          <img class="icon" src="icons/icon-water-outline-small.svg" alt="">
          <span>Water</span>
        </div>
      </div>
      <div class="hero-title-row">
        <h2 class="hero-title">201025 Washington</h2>
        <button class="round-icon-btn" aria-label="Edit"><img class="icon" src="icons/icon-edit.svg" alt=""></button>
      </div>
      <div class="hero-info">
        <p>Stoney Ridge Bnd 12821, Del Valle, Texas, 78617</p>
        <p>01/12/2022</p>
      </div>
    </div>

    <!-- Stats card -->
    <div class="card stats-card">
      <div class="stats-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">Rooms</span></div>
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">Floors</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">Comments</span></div>
      </div>
      <button class="pill-btn pill-btn-outline">
        <img class="icon" src="icons/icon-projects-list.svg" alt="">
        View rooms
      </button>
    </div>

    <!-- Sketches card -->
    <div class="card section-card">
      <div class="section-card-head">
        <h3 class="section-card-title">Sketches</h3>
      </div>
      <button class="pill-btn">
        <img class="icon" src="icons/icon-sketch.svg" alt="">
        Request sketch
      </button>
    </div>

    <!-- Scope of work card -->
    <div class="card section-card">
      <div class="section-card-head">
        <h3 class="section-card-title">Scope of work</h3>
      </div>
      <button class="pill-btn">
        <img class="icon" src="icons/icon-sow.svg" alt="">
        Add Scope of work
      </button>
    </div>

    <!-- Estimates card -->
    <div class="card section-card">
      <div class="section-card-head">
        <h3 class="section-card-title">Estimates</h3>
      </div>
      <button class="pill-btn">
        <img class="icon" src="icons/icon-estimate.svg" alt="">
        Request estimate
      </button>
    </div>

    <!-- Share access -->
    <button class="pill-btn pill-btn-outline">
      <img class="icon" src="icons/icon-share.svg" alt="">
      Share access
    </button>

  </div>

  <!-- Tab bar -->
  <div class="tab-bar-wrap">
    <div class="tab-bar">
      <div class="tab active">
        <img class="icon" src="icons/icon-residential.svg" alt="">
        <span>Projects</span>
      </div>
      <div class="tab">
        <img class="icon" src="icons/icon-360.svg" alt="">
        <span>Camera</span>
      </div>
      <div class="tab">
        <img class="icon" src="icons/icon-help.svg" alt="">
        <span>Support</span>
      </div>
      <div class="tab">
        <img class="icon" src="icons/icon-settings.svg" alt="">
        <span>Settings</span>
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const p = params.get('p') || '1';
  const isLegacy = params.get('v') === 'old';
  document.body.className = 'proposal-' + p + (isLegacy ? ' legacy' : '');
</script>
</body>
</html>
