<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Арканоид — Richard Edition</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #141830;
      --text: #e6e8ef;
      --muted: #9aa3b2;
      --accent: #5b8cff;
      --accent-2: #22d3ee;
      --danger: #ff6b6b;
      --success: #00d68f;
      --gold: #ffcf33;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(1200px 800px at 60% 0%, #111735 0%, var(--bg) 60%);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--text);
    }

    .wrap {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .title {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .title h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.3px;
    }
    .title .sub {
      font-size: 12px;
      color: var(--muted);
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(5, minmax(70px, 1fr));
      gap: 8px;
      width: 100%;
    }
    .hud .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 56px;
    }
    .hud .label { font-size: 11px; color: var(--muted); }
    .hud .value { font-weight: 700; letter-spacing: 0.2px; }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .btn {
      background: linear-gradient(180deg, var(--accent), #4068ff);
      color: white;
      border: 0;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .08s ease, filter .2s ease;
      letter-spacing: 0.2px;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: translateY(1px) scale(0.98); }
    .btn.secondary {
      background: linear-gradient(180deg, #1e223f, #171b33);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      font-weight: 600;
    }

    .game {
      position: relative;
      background: radial-gradient(900px 600px at 50% 20%, rgba(91,140,255,0.12), rgba(34,211,238,0.08), transparent 60%), #0b0e1a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: auto; }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(10,12,24,0.65), rgba(10,12,24,0.55));
      color: var(--text);
      z-index: 2;
      padding: 20px;
    }
    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 18px;
      width: min(520px, 92vw);
      text-align: center;
    }
    .panel h2 { margin: 0 0 8px; font-size: 22px; }
    .panel p { margin: 6px 0 14px; color: var(--muted); font-size: 14px; line-height: 1.4; }
    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      background: #0b0f1f;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--accent-2);
    }
    .mobile-tip { display: none; }
    @media (max-width: 740px) {
      .hud { grid-template-columns: repeat(2, 1fr); }
      .mobile-tip { display: inline; }
    }

    /* Touch controls area */
    .touch-zone {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Toast */
    .toast {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 14px;
      background: rgba(20,24,48,0.9);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      opacity: 0;
      transition: opacity .3s ease;
      pointer-events: none;
      z-index: 3;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <h1>Арканоид — Richard Edition</h1>
        <span class="sub">Играй прямо в браузере</span>
      </div>
      <div class="actions">
        <button id="btnPause" class="btn secondary">Пауза</button>
        <button id="btnRestart" class="btn">Заново</button>
      </div>
    </header>

    <section class="hud">
      <div class="card">
        <div class="label">Счёт</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="card">
        <div class="label">Рекорд (локально)</div>
        <div class="value" id="hiscore">0</div>
      </div>
      <div class="card">
        <div class="label">Уровень</div>
        <div class="value" id="level">1</div>
      </div>
      <div class="card">
        <div class="label">Жизни</div>
        <div class="value" id="lives">3</div>
      </div>
      <div class="card">
        <div class="label">Управление</div>
        <div class="value">
          <span class="kbd">←</span> <span class="kbd">→</span> / мышь / <span class="mobile-tip">тач</span>
        </div>
      </div>
    </section>

    <div id="game" class="game">
      <canvas id="canvas" width="900" height="650" aria-label="Игровое поле арканоида"></canvas>
      <div class="overlay" id="overlay">
        <div class="panel">
          <h2>Готов?</h2>
          <p>
            Управляй платформой: стрелки <span class="kbd">←</span>/<span class="kbd">→</span>, мышь или свайп.
            Запуск мяча — <span class="kbd">Пробел</span> или клик. Пауза — <span class="kbd">P</span>.
          </p>
          <button class="btn" id="btnStart">Играть</button>
        </div>
      </div>
      <div class="touch-zone" id="touchZone" aria-hidden="true"></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const btnStart = document.getElementById('btnStart');
      const btnPause = document.getElementById('btnPause');
      const btnRestart = document.getElementById('btnRestart');
      const scoreEl = document.getElementById('score');
      const hiscoreEl = document.getElementById('hiscore');
      const levelEl = document.getElementById('level');
      const livesEl = document.getElementById('lives');
      const touchZone = document.getElementById('touchZone');
      const toast = document.getElementById('toast');

      // DPR-aware rendering
      function fitCanvasToDisplay() {
        const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1)); // cap for perf
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.width * 0.72 * dpr); // 900x650 ratio ≈ 0.72
        scale = dpr;
      }
      let scale = 1;
      fitCanvasToDisplay();
      window.addEventListener('resize', fitCanvasToDisplay);

      // Game state
      let running = false;
      let paused = false;
      let awaitingLaunch = true;

      const state = {
        score: 0,
        hiscore: Number(localStorage.getItem('arkanoid_hiscore') || 0),
        level: 1,
        lives: 3,
        bricks: [],
      };

      // Entities
      const paddle = {
        w: 120, h: 16,
        x: 0, y: 0,
        speed: 720, // px/s
        targetX: null,
      };

      const ball = {
        x: 0, y: 0, r: 9,
        vx: 0, vy: 0,
        speed: 410, // base speed
        maxBounce: Math.PI / 3, // 60deg
      };

      // Level config
      function makeLevel(level) {
        const cols = 12;
        const baseRows = 4;
        const rows = Math.min(baseRows + Math.floor((level - 1) * 0.75), 10);
        const brickW = (canvas.width / scale - 80) / cols;
        const brickH = 24;
        const bricks = [];
        const colors = ['#5b8cff', '#22d3ee', '#00d68f', '#ffcf33', '#ff6b6b', '#a78bfa'];

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            // Pattern: gaps + hard bricks
            const gap = (r + c + level) % 11 === 0;
            if (gap) continue;
            const hard = (r * c + level) % 9 === 0; // needs 2 hits
            bricks.push({
              x: 40 + c * brickW,
              y: 80 + r * brickH,
              w: brickW - 6,
              h: brickH - 6,
              hits: hard ? 2 : 1,
              color: colors[(r + c) % colors.length],
            });
          }
        }
        return bricks;
      }

      function resetBall(onPaddle = true) {
        paddle.w = Math.max(80, 120 - (state.level - 1) * 6);
        paddle.x = (canvas.width/scale - paddle.w) / 2;
      }

      function placeBallOnPaddle() {
        ball.x = paddle.x + paddle.w/2;
        ball.y = (canvas.height/scale) - 60;
        ball.vx = 0; ball.vy = 0;
        awaitingLaunch = true;
      }

      function launchBall() {
        const ang = (Math.random() * (Math.PI/3)) + Math.PI/6; // 30-90 deg
        const dir = Math.random() < 0.5 ? -1 : 1;
        ball.vx = Math.cos(ang) * ball.speed * dir;
        ball.vy = -Math.sin(ang) * ball.speed;
        awaitingLaunch = false;
      }

      function resetLevel() {
        state.bricks = makeLevel(state.level);
        resetBall(true);
        placeBallOnPaddle();
      }

      function nextLevel() {
        state.level++;
        showToast(`Уровень ${state.level}`);
        levelEl.textContent = state.level;
        // Increase base speed a bit
        ball.speed += 20;
        resetLevel();
      }

      function loseLife() {
        state.lives--;
        livesEl.textContent = state.lives;
        if (state.lives <= 0) {
          gameOver();
        } else {
          resetBall(true);
          placeBallOnPaddle();
        }
      }

      function gameOver() {
        running = false;
        paused = false;
        awaitingLaunch = true;
        overlay.style.display = 'grid';
        overlay.querySelector('h2').textContent = 'Игра окончена';
        overlay.querySelector('p').innerHTML = `Счёт: <b>${state.score}</b>. Нажми «Играть», чтобы начать заново.`;
        btnPause.textContent = 'Пауза';
      }

      function startGame() {
        state.score = 0;
        state.level = 1;
        state.lives = 3;
        scoreEl.textContent = state.score;
        levelEl.textContent = state.level;
        livesEl.textContent = state.lives;
        running = true;
        paused = false;
        awaitingLaunch = true;
        overlay.style.display = 'none';
        ball.speed = 410;
        resetLevel();
        loop(0);
      }

      // Controls
      const keys = new Set();
      document.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
          keys.add(e.code);
          e.preventDefault();
        } else if (e.code === 'Space') {
          if (awaitingLaunch && running && !paused) launchBall();
          e.preventDefault();
        } else if (e.code === 'KeyP') {
          togglePause();
          e.preventDefault();
        }
      });
      document.addEventListener('keyup', (e) => {
        keys.delete(e.code);
      });

      // Mouse move to target paddle
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width/rect.width);
        paddle.targetX = x/scale - paddle.w/2;
      });
      canvas.addEventListener('mouseleave', () => { paddle.targetX = null; });

      // Click to launch
      canvas.addEventListener('click', () => {
        if (awaitingLaunch && running && !paused) launchBall();
      });

      // Touch controls: drag left/right, tap to launch
      let lastTouchX = null;
      touchZone.addEventListener('touchstart', (e) => {
        if (awaitingLaunch && running && !paused) {
          launchBall();
        }
        const t = e.changedTouches[0];
        lastTouchX = t.clientX;
      }, {passive: true});
      touchZone.addEventListener('touchmove', (e) => {
        const t = e.changedTouches[0];
        const rect = canvas.getBoundingClientRect();
        const x = (t.clientX - rect.left) * (canvas.width/rect.width);
        paddle.targetX = x/scale - paddle.w/2;
      }, {passive: true});
      touchZone.addEventListener('touchend', () => { paddle.targetX = null; }, {passive: true});

      btnStart.addEventListener('click', startGame);
      btnRestart.addEventListener('click', () => {
        overlay.style.display = 'none';
        startGame();
      });
      btnPause.addEventListener('click', () => togglePause());

      function togglePause() {
        if (!running) return;
        paused = !paused;
        btnPause.textContent = paused ? 'Продолжить' : 'Пауза';
        if (!paused) requestAnimationFrame(loop);
      }

      function showToast(text, timeout = 1200) {
        toast.textContent = text;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), timeout);
      }

      // Helpers
      function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

      // Game Loop
      let prev = 0;
      function loop(ts) {
        if (!running || paused) return;
        const dt = Math.min(32, ts - prev) / 1000; // clamp dt
        prev = ts;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      function update(dt) {
        // Paddle keyboard
        let dir = 0;
        if (keys.has('ArrowLeft')) dir -= 1;
        if (keys.has('ArrowRight')) dir += 1;
        if (dir !== 0) {
          paddle.x += dir * paddle.speed * dt;
          paddle.targetX = null; // keyboard overrides
        }
        // Paddle mouse/touch target
        if (paddle.targetX !== null && paddle.targetX !== undefined) {
          const dx = paddle.targetX - paddle.x;
          paddle.x += clamp(dx, -paddle.speed*dt, paddle.speed*dt);
        }
        paddle.x = clamp(paddle.x, 12, (canvas.width/scale) - paddle.w - 12);
        paddle.y = (canvas.height/scale) - 40;

        if (awaitingLaunch) {
          placeBallOnPaddle();
          return;
        }

        // Move ball
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // Wall collisions
        if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; }
        if (ball.x + ball.r > canvas.width/scale) { ball.x = (canvas.width/scale) - ball.r; ball.vx *= -1; }
        if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; }
        if (ball.y - ball.r > canvas.height/scale) {
          // miss
          loseLife();
        }

        // Paddle collision
        if (ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h &&
            ball.x >= paddle.x && ball.x <= paddle.x + paddle.w && ball.vy > 0) {
          // compute bounce angle based on hit position
          const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
          const angle = hit * ball.maxBounce; // -max..+max
          const speed = Math.hypot(ball.vx, ball.vy) * 1.01; // tiny accel
          ball.vx = Math.sin(angle) * speed;
          ball.vy = -Math.cos(angle) * speed;
          // Nudge out of paddle
          ball.y = paddle.y - ball.r - 0.5;
        }

        // Brick collisions (AABB vs circle rough)
        for (let i = state.bricks.length - 1; i >= 0; i--) {
          const b = state.bricks[i];
          // broad-phase check
          if (ball.x + ball.r < b.x || ball.x - ball.r > b.x + b.w ||
              ball.y + ball.r < b.y || ball.y - ball.r > b.y + b.h) continue;

          // Find nearest point on rect
          const nx = clamp(ball.x, b.x, b.x + b.w);
          const ny = clamp(ball.y, b.y, b.y + b.h);
          const dx = ball.x - nx;
          const dy = ball.y - ny;
          const dist2 = dx*dx + dy*dy;

          if (dist2 <= ball.r*ball.r) {
            // Reflect: decide axis by penetration
            const overlapX = Math.min(Math.abs(ball.x - (b.x)) , Math.abs(ball.x - (b.x + b.w)));
            const overlapY = Math.min(Math.abs(ball.y - (b.y)) , Math.abs(ball.y - (b.y + b.h)));
            if (overlapX < overlapY) {
              ball.vx *= -1;
            } else {
              ball.vy *= -1;
            }
            b.hits--;
            const gained = 10 * (b.hits === 0 ? 1 : 0.5);
            state.score += Math.round(gained);
            scoreEl.textContent = state.score;

            if (b.hits <= 0) {
              state.bricks.splice(i, 1);
            }
            // update hiscore
            if (state.score > state.hiscore) {
              state.hiscore = state.score;
              localStorage.setItem('arkanoid_hiscore', String(state.hiscore));
              hiscoreEl.textContent = state.hiscore;
            }
          }
        }

        // Win level
        if (state.bricks.length === 0) {
          nextLevel();
        }
      }

      function render() {
        const w = canvas.width, h = canvas.height;
        ctx.save();
        ctx.scale(scale, scale);

        // Clear
        ctx.clearRect(0, 0, w, h);

        // Subtle starfield/parallax
        drawBackdrop();

        // Bricks
        for (const b of state.bricks) {
          const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
          grad.addColorStop(0, 'rgba(255,255,255,0.15)');
          grad.addColorStop(1, 'rgba(255,255,255,0.02)');
          ctx.fillStyle = b.color;
          roundRect(ctx, b.x, b.y, b.w, b.h, 6);
          ctx.fill();
          ctx.fillStyle = grad;
          roundRect(ctx, b.x, b.y, b.w, b.h, 6);
          ctx.fill();

          if (b.hits > 1) {
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.lineWidth = 2;
            roundRect(ctx, b.x+3, b.y+3, b.w-6, b.h-6, 5);
            ctx.stroke();
          }
        }

        // Paddle
        const pGrad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
        pGrad.addColorStop(0, '#2a2f55');
        pGrad.addColorStop(1, '#1c2142');
        ctx.fillStyle = pGrad;
        roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 8);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.stroke();

        // Ball
        const g = ctx.createRadialGradient(ball.x - ball.r/2, ball.y - ball.r/2, 2, ball.x, ball.y, ball.r);
        g.addColorStop(0, '#ffffff');
        g.addColorStop(1, '#8fb4ff');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
        ctx.fill();
        ctx.closePath();
        ctx.restore();
      }

      // Backdrop
      let stars = [];
      function initStars() {
        const count = 80;
        stars = [];
        for (let i=0;i<count;i++) {
          stars.push({
            x: Math.random() * (canvas.width/scale),
            y: Math.random() * (canvas.height/scale),
            r: Math.random()*1.5 + 0.4,
            a: Math.random() * Math.PI*2,
            s: Math.random()*0.6 + 0.2
          });
        }
      }
      function drawBackdrop() {
        if (stars.length === 0) initStars();
        ctx.globalAlpha = 0.65;
        for (const s of stars) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.fill();
          s.a += 0.03 * s.s;
          ctx.globalAlpha = 0.65 + Math.sin(s.a) * 0.2;
        }
        ctx.globalAlpha = 1;
      }

      // Utilities
      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      // Init hiscore
      hiscoreEl.textContent = state.hiscore;

      // Start hint on load
      overlay.style.display = 'grid';
    })();
  </script>
</body>
</html>
